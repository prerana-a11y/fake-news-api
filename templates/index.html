<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Fake News Detector</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* Glass card */
.container {
    width: 90%;
    max-width: 550px;
    padding: 30px;
    border-radius: 20px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(15px);
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
    text-align: center;
}

/* Title glow */
h1 {
    margin-bottom: 20px;
    background: linear-gradient(90deg, #3b82f6, #22c55e);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Textarea */
textarea {
    width: 100%;
    height: 130px;
    border-radius: 12px;
    border: none;
    padding: 15px;
    font-size: 16px;
    outline: none;
    background: rgba(255,255,255,0.1);
    color: white;
}

/* Button */
button {
    margin-top: 15px;
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #3b82f6, #22c55e);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #3b82f6;
}

/* Result */
.result {
    margin-top: 25px;
    font-size: 20px;
}

/* Colors */
.fake { color: #ef4444; }
.real { color: #22c55e; }

/* Loader */
.loader {
    margin-top: 15px;
    display: none;
}

.loader div {
    width: 10px;
    height: 10px;
    margin: 3px;
    background: white;
    border-radius: 50%;
    display: inline-block;
    animation: bounce 1.2s infinite;
}

.loader div:nth-child(2) { animation-delay: 0.2s; }
.loader div:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

/* Confidence bar */
.bar {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    margin-top: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0%;
    transition: 0.5s;
}

</style>
</head>

<body>

<div class="container">
    <h1>🤖 AI Fake News Detector</h1>

    <textarea id="newsText" placeholder="Type or paste news..."></textarea>

    <button onclick="checkNews()">Analyze News 🚀</button>

    <!-- Loader -->
    <div class="loader" id="loader">
        <div></div><div></div><div></div>
    </div>

    <!-- Result -->
    <div class="result" id="result"></div>

    <!-- Confidence Bar -->
    <div class="bar">
        <div class="fill" id="confidenceBar"></div>
    </div>
</div>

<script>
async function checkNews() {
    const text = document.getElementById("newsText").value;
    const loader = document.getElementById("loader");
    const resultDiv = document.getElementById("result");
    const bar = document.getElementById("confidenceBar");

    loader.style.display = "block";
    resultDiv.innerHTML = "";
    bar.style.width = "0%";

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    loader.style.display = "none";

    if (data.prediction === "Fake News") {
        resultDiv.innerHTML = `❌ <span class="fake">Fake News</span>`;
        bar.style.background = "#ef4444";
    } else {
        resultDiv.innerHTML = `✅ <span class="real">Real News</span>`;
        bar.style.background = "#22c55e";
    }

    bar.style.width = data.confidence + "%";
}
</script>

</body>
</html>
