<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Fake News Detector</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
    justify-content: center;
    height: 100vh;
}

/* Chat container */
.chat {
    width: 100%;
    max-width: 600px;
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* Messages area */
.messages {
    flex: 1;
    padding: 20px;
    overflow-y: auto;
}

/* Message bubbles */
.msg {
    margin: 10px 0;
    padding: 12px 15px;
    border-radius: 12px;
    max-width: 75%;
}

.user {
    background: #3b82f6;
    align-self: flex-end;
}

.bot {
    background: #1e293b;
    align-self: flex-start;
}

/* Input area */
.input-area {
    display: flex;
    padding: 10px;
    background: #020617;
}

input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
}

button {
    margin-left: 10px;
    padding: 12px 16px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
    cursor: pointer;
}

/* Typing dots */
.typing {
    display: inline-block;
}

.typing span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 2px;
    background: white;
    border-radius: 50%;
    animation: blink 1.4s infinite;
}

.typing span:nth-child(2) { animation-delay: 0.2s; }
.typing span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
    0%, 80%, 100% { opacity: 0; }
    40% { opacity: 1; }
}
</style>
</head>

<body>

<div class="chat">

    <div class="messages" id="messages"></div>

    <div class="input-area">
        <input id="inputText" placeholder="Type news here...">
        <button onclick="sendMessage()">Send</button>
    </div>

</div>

<script>
function addMessage(text, className) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg " + className;
    msgDiv.innerText = text;
    document.getElementById("messages").appendChild(msgDiv);
    msgDiv.scrollIntoView();
}

function showTyping() {
    const typingDiv = document.createElement("div");
    typingDiv.className = "msg bot typing";
    typingDiv.id = "typing";

    typingDiv.innerHTML = "<span></span><span></span><span></span>";
    document.getElementById("messages").appendChild(typingDiv);
    typingDiv.scrollIntoView();
}

function removeTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}

async function sendMessage() {
    const input = document.getElementById("inputText");
    const text = input.value.trim();

    if (!text) return;

    addMessage(text, "user");
    input.value = "";

    showTyping();

    const response = await fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    });

    const data = await response.json();

    removeTyping();

    let reply = "";

    if (data.prediction === "Fake News") {
        reply = `❌ Fake News\nConfidence: ${data.confidence}%`;
    } else {
        reply = `✅ Real News\nConfidence: ${data.confidence}%`;
    }

    typeMessage(reply);
}

/* Typing animation */
function typeMessage(text) {
    const msgDiv = document.createElement("div");
    msgDiv.className = "msg bot";
    document.getElementById("messages").appendChild(msgDiv);

    let i = 0;
    function typing() {
        if (i < text.length) {
            msgDiv.innerText += text.charAt(i);
            i++;
            setTimeout(typing, 20);
        }
    }
    typing();
}
</script>

</body>
</html>
